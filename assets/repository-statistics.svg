<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="479" viewBox="0 0 1120 479" preserveAspectRatio="xMinYMin meet" role="img">
<style>
.card{
    fill:#ffffff;
    stroke:#d0d7de;
    stroke-width:1;
}

.text{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
}

.title{
    fill:#24292f;
    font-size:22px;
    font-weight:400;
}

.metric-value{
    fill:#24292f;
    font-size:22px;
    font-weight:600;
}

.metric-label{
    fill:#57606a;
    font-size:14px;
    font-weight:400;
}

.section-title{
    fill:#24292f;
    font-size:16px;
    font-weight:600;
}

.contributor-name{
    fill:#0969da;
    font-size:15px;
    font-weight:600;
}

.contributor-count{
    fill:#57606a;
    font-size:14px;
    font-weight:400;
}

.footer{
    fill:#57606a;
    font-size:13px;
    font-weight:400;
}

.divider{
    stroke:#d8dee4;
    stroke-width:1;
}

@media(prefers-color-scheme:dark){

    .card{
        fill:#0d1117;
        stroke:#30363d;
    }

    .title,
    .metric-value,
    .section-title{
        fill:#c9d1d9;
    }

    .metric-label,
    .contributor-count,
    .footer{
        fill:#8b949e;
    }

    .contributor-name{
        fill:#58a6ff;
    }

    .divider{
        stroke:#21262d;
    }
}
</style>
<text class="text title" x="0" y="26">Repository statistics</text>
