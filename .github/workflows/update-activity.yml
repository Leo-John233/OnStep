name: Update Repository Activity

on:
  push:
    branches:
      - release-4.24

  workflow_dispatch:

  # 即使近期没有新的 Commit，也每天刷新一次“最近 7 天”和年度贡献图
  # GitHub Actions 的 cron 使用 UTC
  # 00:15 UTC = Asia/Shanghai 08:15
  schedule:
    - cron: "15 0 * * *"

concurrency:
  group: repository-activity-pages
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:

  build:
    name: Generate activity
    runs-on: ubuntu-latest

    steps:

      - name: Checkout release-4.24
        uses: actions/checkout@v6
        with:
          ref: release-4.24
          fetch-depth: 0

      - name: Generate repository activity
        env:
          ACTIVITY_TIMEZONE: Asia/Shanghai
        run: |
          python3 .github/scripts/update_activity.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site


  deploy:
    name: Deploy activity
    runs-on: ubuntu-latest

    needs:
      - build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
