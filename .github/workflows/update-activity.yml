name: Update Repository Activity

on:
  push:
    branches:
      - "release-*"

  workflow_dispatch:

  # 每天刷新一次最近 7 天、年度贡献图和全部分支统计
  # GitHub Actions cron 使用 UTC
  # 00:15 UTC = Asia/Shanghai 08:15
  schedule:
    - cron: "15 0 * * *"

concurrency:
  group: repository-activity-pages
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    name: Generate activity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout statistics generator
        uses: actions/checkout@v6
        with:
          ref: release-4.24
          fetch-depth: 0

      - name: Fetch all repository branches
        run: |
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --prune
          echo "Available release branches:"
          git for-each-ref \
            --format='%(refname:short)' \
            'refs/remotes/origin/release-*'

      - name: Generate repository activity
        env:
          ACTIVITY_TIMEZONE: Asia/Shanghai
          ACTIVITY_BASE_BRANCH: release-4.24
          ACTIVITY_BRANCH_PATTERN: "release-*"
        run: |
          python3 .github/scripts/update_activity.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy activity
    runs-on: ubuntu-latest
    needs:
      - build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
